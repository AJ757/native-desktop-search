name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet 
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          sudo rm -rf /opt/ghc
          df -h

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Placeholder for the frontend build output
        run: mkdir -p ../dist

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Generated TS bindings are up to date
        working-directory: .
        run: git diff --exit-code src/bindings

  frontend:
    name: Frontend (lint, format, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
