[package]
name = "native-desktop-search"
version = "0.1.0"
description = "Local-first desktop search across local files and cloud sources"
authors = [
    "Ajeetha J",
    "Vishwani",
    "K Sai Jyothirmayi",
    "Lakshana Baskaran",
    "Vandana Padman",
]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "native_desktop_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26.2"
fastembed = "7.1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
oauth2 = "5.0.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
tokio = { version = "1.53.1", features = ["full"] }
tauri-plugin-global-shortcut = "2.4.0"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite_migration = "2.6.0"
ts-rs = "12.0.1"
notify-debouncer-full = "0.7.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
calamine = "0.34"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
regex = "1.13.1"
dotenvy = "0.15.7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
